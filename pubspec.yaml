name: feed_pilot
description: Automated Poultry Feeding System — Flutter Android Application
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # MQTT
  mqtt_client: ^10.0.0

  # Local storage
  sqflite: ^2.3.3
  path: ^1.9.0 
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2

  # Background service and notifications
  flutter_background_service: ^5.0.5
  flutter_local_notifications: ^17.2.3

  # Device pairing
  mobile_scanner: ^5.2.3

  # Tier 2 REST
  http: ^1.2.2

  # Utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0D1117"
  adaptive_icon_foreground: "assets/images/app_icon.png"